<!-- Confetti -->
@if (isCaught) {
<div class="confetti-overlay">
  @for (piece of confettiPieces; track $index) {
  <div class="confetti-piece"
       [style.--x]="piece.x + '%'"
       [style.--delay]="piece.delay + 's'"
       [style.--color]="piece.color"
       [style.--rotation]="piece.rotation + 'deg'">
  </div>
  }
</div>
}

<!-- Caught toast -->
@if (isCaught) {
<div class="caught-toast">
  <span class="caught-emoji">🎉</span>
  <span class="caught-text">CAUGHT!</span>
</div>
}

<!-- Game area -->
@if (showCat && isLoggedIn()) {
<div class="game-area"
     [class.is-entering]="isEntering"
     [class.is-dodging]="isDodging"
     [style.--cat-x]="pos().x + '%'"
     [style.--cat-y]="pos().y + '%'">

  <div class="cat-slot"
       (mouseenter)="onCatHover()"
       (click)="catchCat()">

    <div class="speech-bubble" [class.nervous]="dodgeCount() >= maxDodges - 2">
      {{ taunt() }}
    </div>

    <!-- SVG Cat -->
    <svg class="cat-svg" viewBox="0 0 120 130"
         [class.caught-svg]="isCaught">
      <!-- Tail -->
      <path class="tail" d="M83,78 Q106,58 100,38" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>

      <!-- Body -->
      <ellipse cx="60" cy="78" rx="26" ry="20" fill="#1a1a2e"/>

      <!-- Paws -->
      <ellipse cx="44" cy="97" rx="9" ry="5" fill="#1a1a2e"/>
      <ellipse cx="76" cy="97" rx="9" ry="5" fill="#1a1a2e"/>

      <!-- Belly patch -->
      <ellipse cx="60" cy="82" rx="14" ry="11" fill="#2d2d4a" opacity="0.5"/>

      <!-- Head -->
      <circle cx="60" cy="44" r="27" fill="#1a1a2e"/>

      <!-- Ears -->
      <polygon points="38,24 30,-2 52,16" fill="#1a1a2e" class="ear"/>
      <polygon points="40,20 34,4 50,15" fill="#e8bd18" class="inner-ear"/>
      <polygon points="82,24 90,-2 68,16" fill="#1a1a2e" class="ear"/>
      <polygon points="80,20 86,4 70,15" fill="#e8bd18" class="inner-ear"/>

      <!-- Eyes (normal) -->
      <g class="eyes-normal">
        <!-- White sclera -->
        <ellipse cx="46" cy="42" rx="8" ry="9" fill="#fff"/>
        <ellipse cx="74" cy="42" rx="8" ry="9" fill="#fff"/>
        <!-- Iris -->
        <ellipse cx="46" cy="42" rx="6" ry="7" fill="#e8bd18" class="eyeball"/>
        <ellipse cx="74" cy="42" rx="6" ry="7" fill="#e8bd18" class="eyeball"/>
        <!-- Pupils -->
        <ellipse cx="46" cy="43" rx="3" ry="6" fill="#0a0a0a" class="pupil"/>
        <ellipse cx="74" cy="43" rx="3" ry="6" fill="#0a0a0a" class="pupil"/>
        <!-- Eye shine -->
        <circle cx="44" cy="39" r="1.5" fill="#fff"/>
        <circle cx="72" cy="39" r="1.5" fill="#fff"/>
      </g>

      <!-- Eyes (dizzy / caught) -->
      <g class="eyes-dizzy">
        <circle cx="46" cy="42" r="7" fill="#ef4444"/>
        <circle cx="74" cy="42" r="7" fill="#ef4444"/>
        <line x1="43" y1="39" x2="49" y2="45" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <line x1="43" y1="45" x2="49" y2="39" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <line x1="71" y1="39" x2="77" y2="45" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <line x1="71" y1="45" x2="77" y2="39" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Nose -->
      <polygon points="60,51 56,56 64,56" fill="#e8bd18"/>

      <!-- Mouth -->
      <path d="M55,58 Q60,63 65,58" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

      <!-- Whiskers -->
      <g stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
        <line x1="38" y1="50" x2="16" y2="46"/>
        <line x1="38" y1="55" x2="14" y2="55"/>
        <line x1="82" y1="50" x2="104" y2="46"/>
        <line x1="82" y1="55" x2="106" y2="55"/>
      </g>

      <!-- Blush marks -->
      <ellipse cx="38" cy="50" rx="5" ry="3" fill="#f43f5e" opacity="0.25"/>
      <ellipse cx="82" cy="50" rx="5" ry="3" fill="#f43f5e" opacity="0.25"/>
    </svg>

  </div>
  </div>
}

<!-- Scratch card modal -->
@if (isModal) {
<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-card-container" (click)="$event.stopPropagation()">
    <button class="modal-close-btn" (click)="closeModal()" aria-label="Close modal">×</button>
    <app-scratch-card [isModal]="true" (closeCard)="closeModal()"></app-scratch-card>
  </div>
</div>
}
