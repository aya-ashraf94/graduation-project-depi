<ng-container [ngSwitch]="variant()">
  <!-- 1. CARD IMG OVERLAY VARIANT -->
  <ng-container *ngSwitchCase="'overlay'">
    <div class="card-status-overlay" *ngIf="status().toLowerCase() === 'sold' || status().toLowerCase() === 'reserved' || status().toLowerCase() === 'draft'">
      <span class="status-overlay-tag" [class.sold-tag]="status().toLowerCase() === 'sold'" [class.reserved-tag]="status().toLowerCase() === 'reserved'" [class.draft-tag]="status().toLowerCase() === 'draft'">
        {{ status() | uppercase }}
      </span>
    </div>
  </ng-container>

  <!-- 2. STANDARD PILL VARIANT -->
  <ng-container *ngSwitchDefault>
    <span class="status-pill" [ngClass]="{
      'status-available': status().toLowerCase() === 'available' || status().toLowerCase() === 'active',
      'status-sold': status().toLowerCase() === 'sold',
      'status-draft': status().toLowerCase() === 'draft',
      'status-reserved': status().toLowerCase() === 'reserved',
      'status-active': status().toLowerCase() === 'active' || status().toLowerCase() === 'active_role',
      'status-suspended': status().toLowerCase() === 'suspended'
    }">
      {{ status() | uppercase }}
    </span>
  </ng-container>
</ng-container>
