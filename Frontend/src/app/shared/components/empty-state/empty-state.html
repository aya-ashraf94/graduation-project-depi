<!-- =========================================================================
     EMPTY STATE COMPONENT TEMPLATE
     ========================================================================= -->

<!-- ===== 1. TABLE ROW VARIANT ===== -->
@if (variant() === 'table-row') {
  <tr>
    <td [attr.colspan]="colspan()" class="empty-table-cell text-center" style="padding: 3rem 1rem; text-align: center;">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">{{ icon() }}</div>
      @if (title()) {
        <h4 style="font-weight: 800; font-size: 1.1rem; margin-bottom: 0.5rem; text-transform: uppercase; color: var(--black);">{{ title() }}</h4>
      }
      @if (description()) {
        <p style="color: var(--gray-3); font-size: 0.95rem; margin-bottom: 1.5rem; max-width: 400px; margin-left: auto; margin-right: auto;">{{ description() }}</p>
      }
      @if (ctaLabel()) {
        <button class="btn btn-primary" type="button" (click)="onCtaClick()">{{ ctaLabel() }}</button>
      }
    </td>
  </tr>
}

<!-- ===== 2. GENERAL PAGE / CARD VARIANT ===== -->
@if (variant() !== 'table-row') {
  <div class="empty-state">
    <div class="empty-state-icon" style="font-size: 3rem; margin-bottom: 1rem;">{{ icon() }}</div>
    @if (title()) {
      <h3 style="font-family: var(--font-primary); font-weight: 900; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--black);">{{ title() }}</h3>
    }
    @if (description()) {
      <p style="font-family: var(--font-secondary); color: var(--gray-3); margin-bottom: 1.5rem; max-width: 450px; margin-left: auto; margin-right: auto;">{{ description() }}</p>
    }
    @if (ctaLabel()) {
      <button class="btn btn-primary" type="button" (click)="onCtaClick()">{{ ctaLabel() }}</button>
    }
  </div>
}
