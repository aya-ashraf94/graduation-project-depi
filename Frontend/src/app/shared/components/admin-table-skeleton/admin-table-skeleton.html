@for (row of rowsArray(); track $index) {
  <tr class="table-row-skeleton">
    @for (col of columns(); track $index) {
      <td>
        @switch (col) {
          @case ('avatar') {
            <div class="user-profile-cell" style="display: flex; gap: 0.75rem; align-items: center;">
              <div class="skeleton-avatar"></div>
              <div class="skeleton-text-block">
                <div class="skeleton-line name"></div>
                <div class="skeleton-line sub"></div>
              </div>
            </div>
          }
          
          @case ('thumb') {
            <div class="product-cell-skeleton" style="display: flex; gap: 0.75rem; align-items: center;">
              <div class="skeleton-thumb"></div>
              <div class="skeleton-text-block">
                <div class="skeleton-line title"></div>
                <div class="skeleton-line sub"></div>
                <div class="skeleton-line sub-meta"></div>
              </div>
            </div>
          }

          @case ('text') {
            <div class="skeleton-line text"></div>
          }

          @case ('number') {
            <div class="skeleton-line number"></div>
          }

          @case ('badge') {
            <div class="skeleton-badge"></div>
          }

          @case ('actions') {
            <div class="skeleton-actions"></div>
          }
        }
      </td>
    }
  </tr>
}
