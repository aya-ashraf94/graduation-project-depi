<div class="legal-page">
  <div class="legal-header">
    <h1 class="legal-title">Contact Us</h1>
    <p class="legal-subtitle">We're here to help.</p>
  </div>
  
  <div class="contact-grid">
    <div class="contact-info">
      <h3>Get in touch</h3>
      <p>Have a question or need assistance? Fill out the form or reach out directly.</p>
      
      <div class="info-block">
        <strong>Email:</strong> support@nafa3ni.com<br>
        <strong>Twitter:</strong> @nafa3ni_support<br>
      </div>
    </div>
    
    <div class="contact-form-box">
      <form class="neo-form" (ngSubmit)="submit()" #contactForm="ngForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" class="neo-input" placeholder="Your name" [(ngModel)]="name" name="name" required>
        </div>
        
        <div class="form-group">
          <label>Email</label>
           <input type="email" class="neo-input" placeholder="your@email.com" [(ngModel)]="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label>Message</label>
          <textarea class="neo-input" rows="5" placeholder="How can we help?" [(ngModel)]="message" name="message" required></textarea>
        </div>
        
        <button type="submit" class="btn-neo-primary" [disabled]="sending()">
          {{ sending() ? 'Sending...' : 'Send Message' }}
        </button>
      </form>
    </div>
  </div>
</div>
