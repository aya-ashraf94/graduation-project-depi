<app-auth-layout title="Create Account" subtitle="Join the community and start buying or selling today.">
  @if (errorMessage()) {
    <div class="auth-error-banner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="register()">
    <div class="auth-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
      <app-form-field label="First Name" [control]="registerForm.get('firstName')" [required]="true" >
        <input id="register-firstname" type="text" class="auth-input" placeholder="First name" formControlName="firstName" [disabled]="isLoading()" />
      </app-form-field>
      <app-form-field label="Last Name" [control]="registerForm.get('lastName')" [required]="true" >
        <input id="register-lastname" type="text" class="auth-input" placeholder="Last name" formControlName="lastName" [disabled]="isLoading()" />
      </app-form-field>
    </div>

    <app-form-field label="Email" [control]="registerForm.get('email')" [required]="true" >
      <input id="register-email" type="email" class="auth-input" placeholder="Email address" formControlName="email" [disabled]="isLoading()" />
    </app-form-field>

    <div class="auth-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
      <app-form-field label="Password" [control]="registerForm.get('password')" [required]="true"  hint="8+ chars, upper + lowercase, number &amp; symbol">
        <input id="register-password" type="password" class="auth-input" placeholder="Password" formControlName="password" [disabled]="isLoading()" />
      </app-form-field>
      <app-form-field label="Confirm" [control]="registerForm.get('confirmPassword')" [required]="true" >
        <input id="register-confirm" type="password" class="auth-input" placeholder="Confirm password" formControlName="confirmPassword" [disabled]="isLoading()" />
      </app-form-field>
    </div>

    <button type="submit" class="auth-submit-btn" [disabled]="isLoading()">
      {{ isLoading() ? 'REGISTERING...' : 'REGISTER' }}
    </button>
  </form>

  <div class="auth-footer">
    <p class="auth-link">Already have an account? <a routerLink="/auth/login">Sign In</a></p>
  </div>
</app-auth-layout>
