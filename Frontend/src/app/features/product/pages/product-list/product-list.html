<div class="product-list-page">
  <div class="product-layout">

    <!-- ══ SIDEBAR FILTERS ══════════════════════════════════════════════ -->
    <aside class="sidebar-filters" [class.expanded]="mobileFiltersOpen">
      <div class="filter-header" (click)="toggleMobileFilters()">
        <div class="filter-header-left">
          <h2 class="filter-title">FILTERS</h2>
          <span class="mobile-filter-arrow">▼</span>
        </div>
        <button class="btn-reset" (click)="resetFilters(); $event.stopPropagation()">Reset</button>
      </div>

      <div class="filter-groups">

        <!-- Category -->
        <div class="filter-group">
          <label class="filter-label">CATEGORY</label>
          <div class="filter-options">
            <div
              *ngFor="let cat of categories"
              class="checkbox-wrapper"
              (click)="selectCategory(cat)"
            >
              <div class="custom-checkbox" [class.checked]="selectedCategories.has(cat)">
                <svg *ngIf="selectedCategories.has(cat)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4">
                  <path d="M20 6L9 17l-5-5" />
                </svg>
              </div>
              <span class="checkbox-label">{{ cat }}</span>
            </div>
          </div>
        </div>

        <!-- Price Range -->
        <div class="filter-group">
          <label class="filter-label">PRICE RANGE</label>
          <div class="price-range-row">
            <div class="price-input-wrapper">
              <span class="currency-symbol">$</span>
              <input
                id="filter-min-price"
                class="price-input-field"
                type="number"
                [(ngModel)]="minPrice"
                min="0"
              />
            </div>
            <span class="range-dash">—</span>
            <div class="price-input-wrapper">
              <span class="currency-symbol">$</span>
              <input
                id="filter-max-price"
                class="price-input-field"
                type="number"
                [(ngModel)]="maxPrice"
                min="0"
              />
            </div>
          </div>
        </div>

        <!-- Condition -->
        <div class="filter-group">
          <label class="filter-label">CONDITION</label>
          <div class="filter-options">
            <div
              *ngFor="let cond of conditionOptions"
              class="checkbox-wrapper"
              (click)="toggleCondition(cond)"
            >
              <div class="custom-checkbox" [class.checked]="isConditionSelected(cond)">
                <svg *ngIf="isConditionSelected(cond)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4">
                  <path d="M20 6L9 17l-5-5" />
                </svg>
              </div>
              <span class="checkbox-label">{{ cond }}</span>
            </div>
          </div>
        </div>

        <!-- Apply Button -->
        <button id="btn-apply-filters" class="btn-apply-filters" (click)="applyFilters()">
          APPLY FILTERS
        </button>

      </div>
    </aside>

    <!-- ══ MAIN CONTENT ═════════════════════════════════════════════════ -->
    <main class="product-main">

      <!-- Header + Sort -->
      <header class="inventory-header">
        <div class="inventory-top-row">
          <div class="header-text-main">
            <h1 class="inventory-title">BROWSE ALL ARCHIVE</h1>
            <p class="verified-count">{{ products.length }} ITEMS SHOWN</p>
          </div>

          <div class="sort-control-container">
            <!-- Mobile dedicated Refine Toggle -->
            <button class="btn-refine-mobile" (click)="toggleMobileFilters()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
              </svg>
              REFINE
            </button>

            <button id="btn-sort-toggle" class="btn-sort" (click)="toggleSort()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h10M4 18h7" />
              </svg>
              {{ selectedSortLabel }}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>

            <!-- Sort Dropdown -->
            <div class="sort-dropdown" [class.active]="sortOpen">
              <div
                *ngFor="let key of sortKeys"
                class="sort-option"
                [class.active]="selectedSort === key"
                (click)="selectSort(key)"
              >
                {{ sortLabels[key] }}
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Product Grid -->
      <section class="grid-container">
        <div class="products-grid-layout">

          <!-- Loading state (Skeletons) -->
          @if (isLoading) {
            @for (item of [1, 2, 3, 4]; track item) {
              <div class="product-card skeleton-card" style="pointer-events: none;">
                <div class="product-img-wrap skeleton-img-wrap">
                  <div class="skeleton-shimmer"></div>
                </div>
                <div class="product-content">
                  <div class="skeleton-shimmer skeleton-title" style="margin-bottom: 0.6rem;"></div>
                  <div class="metadata-price-row">
                    <div class="skeleton-shimmer skeleton-meta"></div>
                    <div class="skeleton-shimmer skeleton-price" style="width: 4.5rem;"></div>
                  </div>
                </div>
                <div class="product-footer">
                  <div class="skeleton-shimmer skeleton-loc"></div>
                  <div class="skeleton-shimmer skeleton-date"></div>
                </div>
              </div>
            }
          }

          <!-- Empty state -->
          <app-empty-state
            *ngIf="!isLoading && products.length === 0"
            title="No items found"
            description="No items match your filters."
            ctaLabel="CLEAR FILTERS"
            (ctaClick)="resetFilters()"
          ></app-empty-state>

          <app-product-card
            *ngFor="let product of products"
            [product]="product"
            variant="list"
            (wishlistToggle)="toggleWishlist(product.id, $event)"
          ></app-product-card>
        </div>

        <!-- Pagination -->
        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          variant="icons"
          (prevPage)="prevPage()"
          (nextPage)="nextPage()"
          (pageChange)="goToPage($event)"
        ></app-pagination>
      </section>

    </main>
  </div>

  <!-- AUTH REQUIRED MODAL -->
  <app-auth-required-modal
    [isOpen]="showAuthModal"
    (closed)="closeAuthModal()"
  ></app-auth-required-modal>
</div>
