<div class="search-page">
  <div class="container">

    <!-- SEARCH HEADER -->
    <div class="search-header">
      <div class="search-eyebrow">
        <span class="section-label">— SEARCH</span>
      </div>
      <h1 class="search-title" *ngIf="query">
        Results for "<span class="highlight">{{ query }}</span>"
      </h1>
      <h1 class="search-title" *ngIf="!query">Browse All Listings</h1>
      <p class="search-count">{{ totalResults }} item{{ totalResults !== 1 ? 's' : '' }} found</p>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-bar-wrap">
      <div class="search-input-row">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input
          type="text"
          class="search-input"
          [(ngModel)]="query"
          placeholder="Search items, brands, categories..."
          (keyup.enter)="applyFilters()"
        />
        <button class="btn btn-primary search-btn" (click)="applyFilters()">SEARCH</button>
      </div>
    </div>

    <!-- FILTERS ROW -->
    <div class="filters-row">
      <div class="filter-group">
        <label class="filter-label">Category</label>
        <select class="filter-select" [(ngModel)]="selectedCategory" (change)="applyFilters()">
          <option value="">All Categories</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ categoryLabels[cat] }}</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Condition</label>
        <select class="filter-select" [(ngModel)]="selectedCondition" (change)="applyFilters()">
          <option value="">All Conditions</option>
          <option *ngFor="let cond of conditions" [value]="cond">{{ conditionLabels[cond] }}</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Sort By</label>
        <select class="filter-select" [(ngModel)]="sortBy" (change)="applyFilters()">
          <option value="newest">Newest First</option>
          <option value="price_asc">Price: Low → High</option>
          <option value="price_desc">Price: High → Low</option>
          <option value="popular">Most Popular</option>
        </select>
      </div>

      <button class="btn-clear" (click)="clearFilters()">CLEAR FILTERS</button>
    </div>

    <!-- RESULTS GRID -->
    <div class="results-grid" *ngIf="results.length > 0; else noResults">
      <app-product-card
        *ngFor="let item of results"
        [product]="item"
        variant="list"
        (wishlistToggle)="toggleWishlist(item.id, $event)"
      ></app-product-card>
    </div>

    <!-- EMPTY STATE -->
    <ng-template #noResults>
      <app-empty-state
        icon="🔍"
        title="No items found"
        description="Try adjusting your search or filters to find what you're looking for."
        ctaLabel="CLEAR ALL FILTERS"
        (ctaClick)="clearFilters()">
      </app-empty-state>
    </ng-template>

  </div>

  <!-- AUTH REQUIRED MODAL -->
  <app-auth-required-modal
    [isOpen]="showAuthModal"
    (closed)="closeAuthModal()"
  ></app-auth-required-modal>
</div>
