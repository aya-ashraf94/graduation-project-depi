<!-- Global Navbar: Hidden on Auth and Admin pages -->
<app-navbar *ngIf="!isAuthRoute() && !isAdminRoute()"></app-navbar>

<!-- Minimal Navbar: Shown only on Auth pages, hidden on Admin pages -->
<header class="auth-minimal-nav" *ngIf="isAuthRoute() && !isAdminRoute()">
  <div class="minimal-nav-container">
    <a routerLink="/" class="minimal-brand">
      <div class="brand-box"></div>
      <span class="brand-text">NAFA3NI</span>
    </a>
    <a routerLink="/" class="back-home-btn">← Back to Home</a>
  </div>
</header>

<main [class.auth-main]="isAuthRoute() && !isAdminRoute()" 
      [class.admin-main]="isAdminRoute()"
      [class.has-banner]="offerService.activeReservation() && !isAuthRoute() && !isAdminRoute() && !isChatRoute()"
      [style.margin-top]="offerService.activeReservation() && !isAuthRoute() && !isAdminRoute() && !isChatRoute() ? '36px' : '0'">
  <router-outlet></router-outlet>
</main>

<!-- Minimal Footer: Shown only on Auth pages, hidden on Admin pages -->
<footer class="auth-minimal-footer" *ngIf="isAuthRoute() && !isAdminRoute()">
  <div class="minimal-footer-container">
    <a routerLink="/support" [queryParams]="{tab: 'privacy'}" class="minimal-footer-link">Privacy Policy</a>
    <a routerLink="/support" [queryParams]="{tab: 'terms'}" class="minimal-footer-link">Terms & Conditions</a>
    <a routerLink="/support" [queryParams]="{tab: 'help'}" class="minimal-footer-link">Help Center</a>
  </div>
</footer>

<!-- Global Footer: Hidden on Auth, Chat, and Admin pages -->
<app-footer *ngIf="!isAuthRoute() && !isChatRoute() && !isAdminRoute()"></app-footer>

<!-- Global Toast Notifications -->
<app-toast></app-toast>

<!-- Global Confirmation Modals -->
<app-confirm></app-confirm>

<!-- Lucky Cat Easter Egg Game -->
<app-lucky-cat *ngIf="shouldShowLuckyCat()"></app-lucky-cat>
